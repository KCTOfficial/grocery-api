# Builds the documentation website (docs/, Astro + Starlight) and publishes it to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   DOCS_SITE_URL   e.g. https://docs.example.com   (default: https://<owner>.github.io)
#   DOCS_BASE_PATH  e.g. /                          (default: /<repository>)
name: Documentation

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # Never interrupt a production deployment; superseded pull request builds can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve the site URL and base path
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
          CUSTOM_SITE_URL: ${{ vars.DOCS_SITE_URL }}
          CUSTOM_BASE_PATH: ${{ vars.DOCS_BASE_PATH }}
        run: |
          echo "SITE_URL=${CUSTOM_SITE_URL:-https://${OWNER,,}.github.io}" >> "$GITHUB_ENV"
          echo "BASE_PATH=${CUSTOM_BASE_PATH:-/${REPOSITORY}}" >> "$GITHUB_ENV"

      - name: Build with Astro and upload the Pages artifact
        uses: withastro/action@v6
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
